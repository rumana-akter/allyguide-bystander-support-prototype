name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI never uses a real model or key. Live mode stays off.
      ALLYGUIDE_LIVE_MODEL: 'off'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for committed secrets
        run: npm run check:secrets

      - name: Audit dependencies (fail on high or critical advisories)
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Production build (includes Next.js type checking)
        run: npm run build

      - name: Type-check everything, including tests
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
